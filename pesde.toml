name = "emdomanus/guard"
version = "0.1.0"
description = "Identity-preserving runtime guards for Roblox."
license = "MIT"
authors = ["Edward"]
private = true

includes = [
	"pesde.toml",
	"LICENSE",
	"README.md",
	"src/**/*.luau",
]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"
